<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3d632c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Сенокос</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="stick-base"></div>
    <div id="stick-knob"></div>

    <div id="carry" aria-hidden="true"><div id="carry-fill"></div></div>
    <div id="stack-arrow" aria-hidden="true">➜</div>

    <div id="hud">
      <div class="pill" id="hud-stack">
        <span class="hud-stack-line">🌾 <b id="hud-stack-kg">0</b> <small>кг в стогу</small></span>
        <span class="xp" aria-hidden="true"><span id="hud-xp-fill"></span></span>
      </div>
      <div class="pill" id="hud-time">3:00</div>
    </div>
    <div id="debug-line"></div>

    <div id="overlay">
      <h1>Сенокос</h1>
      <p id="overlay-text">
        Веди пальцем — косарь косит сам. Скошенная трава сохнет и золотеет: пройди по ней —
        грабли сгребут сено в тюк. Отвези тюк к стогу до конца дня.
      </p>
      <button id="overlay-button" type="button">Играть</button>
      <div id="look-row" role="group" aria-label="Вид травы"></div>
    </div>

    <div id="perks" hidden>
      <p class="perks-title">Новое улучшение</p>
      <div id="perk-list"></div>
    </div>

    <div id="results" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
