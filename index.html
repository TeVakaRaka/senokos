<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3d632c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Сенокос</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="stick-base"></div>
    <div id="stick-knob"></div>

    <div id="hud">
      <div class="pill" id="hud-mown">Скошено 0 % <small>· 0 кг</small></div>
      <div class="pill" id="hud-time">0:00</div>
    </div>
    <div id="debug-line"></div>

    <div id="overlay">
      <h1>Сенокос</h1>
      <p id="overlay-text">Веди пальцем по экрану — косарь идёт и косит сам.</p>
      <button id="overlay-button" type="button">Играть</button>
      <div id="look-row" role="group" aria-label="Вид травы"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
