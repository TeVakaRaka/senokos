<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3d632c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Сенокос</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="stick-base"></div>
    <div id="stick-knob"></div>

    <div id="carry" aria-hidden="true"><div id="carry-fill"></div></div>
    <div id="stack-arrow" class="edge-arrow" aria-hidden="true">➜</div>
    <div id="flash" aria-hidden="true"></div>

    <div id="hud">
      <div class="pill" id="hud-stack">
        <span class="hud-stack-line">
          <span class="hay-mark">🌾</span><i class="dot me" id="hud-me-dot"></i>
          <b id="hud-stack-kg">0</b> <small id="hud-stack-label">кг в стогу</small>
        </span>
        <span class="xp" aria-hidden="true"><span id="hud-xp-fill"></span></span>
      </div>
      <div class="pill" id="hud-time">3:00</div>
      <div class="pill" id="hud-foe" hidden></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="countdown" aria-live="polite" hidden></div>
    <div id="debug-line"></div>

    <button id="tool" type="button" aria-label="Сменить инструмент: коса или грабли" hidden>
      <span class="tool-cell" data-tool="0">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 22 16.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M17 3C10.5 1.5 4.5 4.5 2 10.5c4-3.2 9-4.6 14-4z" fill="currentColor" />
        </svg>
        <small>Коса</small>
      </span>
      <span class="tool-cell" data-tool="1">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2v13M4 15h16M4.5 15v5.5M8.25 15v5.5M12 15v5.5M15.75 15v5.5M19.5 15v5.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <small>Грабли</small>
      </span>
    </button>

    <div id="overlay">
      <h1>Сенокос</h1>
      <p id="overlay-text">
        Веди пальцем — косарь косит сам. Скошенное сохнет и золотеет. Кнопкой справа внизу
        возьми грабли, сгреби сухое сено в тюк и отвези к своему стогу.
      </p>
      <div id="mode-row">
        <button id="play-solo" class="play" type="button">Играть одному</button>
        <button id="play-pvp" class="play" type="button">
          Против бота
          <small>косой подрежь ему ноги, граблями тащи сено из его стога</small>
        </button>
        <button id="play-net" class="play" type="button" hidden>
          С друзьями
          <small>до четырёх игроков по сети: друзья открывают этот же адрес</small>
        </button>
      </div>
      <button id="overlay-start" class="play primary" type="button" hidden>Начать игру</button>
      <button id="overlay-share" class="play" type="button" hidden>Позвать друзей</button>
      <button id="overlay-action" class="play" type="button" hidden>Обновить</button>
      <div id="look-row" role="group" aria-label="Вид травы"></div>
    </div>

    <div id="perks" hidden>
      <p class="perks-title">Новое улучшение</p>
      <div id="perk-list"></div>
    </div>

    <div id="results" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
